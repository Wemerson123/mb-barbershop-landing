<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#800000" />

    <title>MB Barbershop — Barber on Caxton St, Paddington, Brisbane</title>
    <meta
      name="description"
      content="Precision fades, beard work and razor detail at MB Barbershop, suite 5/149 Caxton St, Paddington. Cuts from A$46, open six days. Book online."
    />
    <link rel="canonical" href="https://www.mbbarbershop.com.au/" />
    <!--
      This deployment is a client preview, not the shop's live site. Keep it out
      of search so it can't compete with mbbarbershop.com.au as a duplicate of a
      real business. Remove this line if it ever becomes the production site.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MB Barbershop" />
    <meta
      property="og:title"
      content="MB Barbershop — Barber on Caxton St, Paddington"
    />
    <meta
      property="og:description"
      content="Precision fades, beard work and razor detail in Paddington, Brisbane. Cuts from A$46, open six days a week."
    />
    <meta property="og:url" content="https://www.mbbarbershop.com.au/" />
    <meta
      property="og:image"
      content="https://wemerson123.github.io/mb-barbershop-landing/img/hero-after.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/img/hero-before.webp" fetchpriority="high" />
    <link rel="prefetch" as="image" href="/img/hero-after.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "MB Barbershop",
        "description": "Barbershop in Paddington, Brisbane offering skin fades, scissor cuts, beard work and razor detail.",
        "url": "https://www.mbbarbershop.com.au/",
        "telephone": "+61481722499",
        "email": "mbbarbershop2025@gmail.com",
        "priceRange": "A$15–A$65",
        "currenciesAccepted": "AUD",
        "paymentAccepted": "Cash, Visa, Mastercard, American Express, Apple Pay, Google Pay, Afterpay",
        "image": "https://www.mbbarbershop.com.au/img/hero-after.webp",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "5/149 Caxton St",
          "addressLocality": "Paddington",
          "addressRegion": "QLD",
          "postalCode": "4064",
          "addressCountry": "AU"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -27.462254,
          "longitude": 153.009323
        },
        "sameAs": ["https://instagram.com/mbbarbershop2025"],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday"],
            "opens": "09:00",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "19:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "16:00"
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Scissor Cut" },
              "price": "65.00",
              "priceCurrency": "AUD"
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Zero / Skin Fade" },
              "price": "60.00",
              "priceCurrency": "AUD"
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Simple Fade" },
              "price": "50.00",
              "priceCurrency": "AUD"
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Kids Cuts (2-12)" },
              "price": "46.00",
              "priceCurrency": "AUD"
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Beard Therapy" },
              "price": "60.00",
              "priceCurrency": "AUD"
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Beard Design" },
              "price": "50.00",
              "priceCurrency": "AUD"
            }
          ]
        },
        "potentialAction": {
          "@type": "ReserveAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.mbbarbershop.com.au/s/appointments",
            "actionPlatform": [
              "http://schema.org/DesktopWebPlatform",
              "http://schema.org/MobileWebPlatform"
            ]
          },
          "result": { "@type": "Reservation", "name": "Barber appointment" }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
